[package]
name = "rebootsnap"
version = "0.1.0"
edition = "2024"
description = "pre-reboot Linux runtime state collector"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "fs", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
procfs = "0.18"
nix = "0.31"
zbus = { version = "5", features = ["tokio"] }
rtnetlink = { version = "0.21", features = ["tokio_socket"] }
netlink-packet-route = "0.22"
neli = "0.7"
flate2 = "1"
tar = "0.4"
chrono = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
